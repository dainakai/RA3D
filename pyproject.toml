[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ra3d"
version = "0.1.1"
description = "Reproducible relation-attention detection and review of 3D particle collisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/ra3d/config/physics/LICENSE-SCALE.txt"]
authors = [{name = "Dai Nakai"}]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.13,<2",
  "scikit-learn==1.7.1", "torch>=2.5,<3", "pillow>=10,<13",
  "pyarrow>=18", "pyyaml>=6", "huggingface-hub>=1.0,<2",
  "flask>=3.1,<4", "threadpoolctl>=3", "zstandard>=0.23", "skops>=0.14,<1", "safetensors>=0.5",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2"]
docs = ["mkdocs-material>=9.6"]
tracking = ["holod3-linker @ git+https://github.com/dainakai/HoloD3-Linker.git@fbe935a5d7fcd6b0c04ad0b2b2b9786c23f08cdf"]

[project.scripts]
ra3d = "ra3d.cli:main"

[project.urls]
Repository = "https://github.com/dainakai/RA3D"
Datasets = "https://huggingface.co/datasets/dnakaikit/RA3D"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ra3d = ["config/*.json", "config/simulation/*.csv", "config/physics/*", "simulation/provenance.json", "_core/*provenance.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: verifies published or original scientific assets", "gpu: requires a CUDA device"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
